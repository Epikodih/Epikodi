name: ci

# Tourne à chaque push, sur toutes les branches (dev et main compris).
# Les résultats s'affichent sur la PR ouverte par auto-pr.yml (même commit).
# Pas de déclencheur pull_request : une PR créée avec le GITHUB_TOKEN ne
# déclencherait pas la CI, et une PR ouverte à la main la lancerait en double.
# Sur dev et main, ces jobs sont des vérifications obligatoires : une PR
# en échec ne peut pas être mergée (voir docs/dev/ci.md).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Version de Flutter fixée : la même en local et en CI (lint et tests
# reproductibles). Pour monter de version : changer ici, puis `flutter upgrade`.
env:
  FLUTTER_VERSION: "3.44.6"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace -- -D warnings
      - name: Tests (cœur + extensions)
        run: cargo test --workspace

  # Lint Flutter (une fois suffit : l'analyse ne dépend pas de l'OS).
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Lint
        run: flutter analyze packages/client packages/design_system apps/tv apps/remote

  # Tests de l'app TV (et des packages qu'elle utilise) sur les trois OS
  # du media center. Même commande que `just test-flutter`.
  tests-tv:
    name: tests TV (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux }
          - { os: windows-latest, target: windows }
          - { os: macos-latest, target: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Tests
        run: dart scripts/test.dart flutter

  build-desktop:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux }
          - { os: windows-latest, target: windows }
          - { os: macos-latest, target: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Dépendances système (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev libssl-dev
      - name: Build du cœur
        run: cargo build -p epikodi-core
      - name: Build de l'app TV
        working-directory: apps/tv
        run: |
          flutter pub get
          flutter build ${{ matrix.target }} --debug